            ${t.amount>0?' | ¥'+t.amount.toLocaleString():''}
          </div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="import-btn sm outline" onclick="deleteTrialItem('${cn.replace(/'/g,"\\'")}',${ti});closeTrialModal()" style="color:var(--danger);border-color:var(--danger)">🗑 删除</button>
          <button class="trial-modal-close" onclick="closeTrialModal()">✕</button>
        </div>
      </div>
      <div class="trial-modal-body">
        <div class="trial-modal-tabs">
          ${['basic','preclass','during','closing','images','followup'].map(k => {
            const labels = {basic:'📋 基本信息',preclass:'🔍 课前沟通',during:'🏋️ 课中记录',closing:'💼 谈单结果',images:'📷 图片资料',followup:'📞 回访记录'};
            return `<button class="trial-modal-tab${trialModalActiveTab===k?' active':''}" onclick="trialModalActiveTab='${k}';renderTrialModal(getCurrentTrial())">${labels[k]}</button>`;
          }).join('')}
        </div>
        ${tabContent}
      </div>
      <div class="trial-modal-footer">
        <div style="font-size:11px;color:var(--text-secondary)">💡 修改后请点击"保存"按钮保存所有更改</div>
        <div style="display:flex;gap:8px">
          <button class="import-btn outline" onclick="closeTrialModal()">取消</button>
          <button class="import-btn" style="background:var(--primary);color:#fff" onclick="saveTrialModal();closeTrialModal()">💾 保存并关闭</button>

}

function getCurrentTrial() {
  if (!trialModalState) return null;
  const cd = mockData.coachDetail[trialModalState.coachName];
  return cd && cd.trials ? cd.trials[trialModalState.trialIdx] : null;
}

function closeTrialModal() {
  const m = document.getElementById('trialDetailModal');
  if (m) m.remove();
  trialModalState = null;
}

function saveTrialModal() {
  if (!trialModalState) return;
  const t = getCurrentTrial();
  if (!t) return;
  const getVal = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const getNum = id => { const v = getVal(id); return v ? parseFloat(v)||0 : 0; };
  
  // Basic info
  t.name = getVal('tm_name') || t.name;
  t.date = getVal('tm_date') || t.date;
  t.type = getVal('tm_type') || t.type;
  t.status = getVal('tm_status') || t.status;
  t.amount = getNum('tm_amount');
  t.salesConsultant = getVal('tm_salesConsultant') || t.salesConsultant || '';
  
  // Prospect info
  if (!t.prospectInfo) t.prospectInfo = {};
  t.prospectInfo.occupation = getVal('tm_occupation');
  t.prospectInfo.age = parseInt(getVal('tm_age'))||0;
  t.prospectInfo.address = getVal('tm_address');
  t.prospectInfo.phone = getVal('tm_phone');
  t.prospectInfo.wechat = getVal('tm_wechat');
  t.prospectInfo.source = getVal('tm_source');
  
  // Pre-class
  if (!t.preClass) t.preClass = {};
  t.preClass.needLevel = getVal('tm_needLevel');
  t.preClass.physicalNeeds = getVal('tm_physicalNeeds');
  t.preClass.mentalNeeds = getVal('tm_mentalNeeds');
  t.preClass.dataNeeds = getVal('tm_dataNeeds');
  t.preClass.exerciseHistory = getVal('tm_exerciseHistory');
  t.preClass.injuryHistory = getVal('tm_injuryHistory');
  t.preClass.coreMotivation = getVal('tm_coreMotivation');
  t.preClass.otherNotes = getVal('tm_otherNotes');
  
  // During class
  if (!t.duringClass) t.duringClass = {};
  t.duringClass.actions = getVal('tm_actions');
  t.duringClass.notes = getVal('tm_notes');
  t.duringClass.coachFeedback = getVal('tm_coachFeedback');
  
  // Closing
  if (!t.closing) t.closing = {};
  t.closing.phase1 = getVal('tm_phase1');
  t.closing.phase2 = getVal('tm_phase2');
  t.closing.phase3 = getVal('tm_phase3');
  t.closing.product = getVal('tm_product');
  t.closing.price = getNum('tm_price');
  t.closing.nonConvertReason = getVal('tm_nonConvertReason');
  
  // Follow-ups
  if (!t.followUps) t.followUps = {};
  ['nextDay','threeDay','oneMonth'].forEach(k => {
    if (!t.followUps[k]) t.followUps[k] = {date:'',done:false};
    t.followUps[k].date = getVal('tm_fu_'+k+'_date');
    t.followUps[k].done = document.getElementById('tm_fu_'+k+'_done')?.checked || false;
  });
  
  // Auto-set follow-up dates if empty
  if (t.date && t.status === 'pending') {
    const d = new Date(t.date);
    if (!t.followUps.nextDay.date) { const nd = new Date(d); nd.setDate(nd.getDate()+1); t.followUps.nextDay.date = nd.toISOString().slice(0,10); }
    if (!t.followUps.threeDay.date) { const td = new Date(d); td.setDate(td.getDate()+3); t.followUps.threeDay.date = td.toISOString().slice(0,10); }
    if (!t.followUps.oneMonth.date) { const md = new Date(d); md.setMonth(md.getMonth()+1); t.followUps.oneMonth.date = md.toISOString().slice(0,10); }
  }
  
  syncTrialAmountsToPeriods();
  syncCoachStats();
  logOperation('edit', '体验课', '编辑体验课: ' + (t.name||'未知'), trialModalState.coachName);
  refreshData();
  showToast('体验课信息已保存', 'success');
}

function deleteTrialItem(coachName, trialIdx) {
  if (!confirm('确定要删除该体验课记录吗？此操作不可恢复。')) return;
  const cd = mockData.coachDetail[coachName];
  var delName = '';
  if (cd && cd.trials) {
    delName = cd.trials[trialIdx] ? cd.trials[trialIdx].name : '';
    cd.trials.splice(trialIdx, 1);
  }
  syncTrialAmountsToPeriods();
  syncCoachStats();
  if (delName) logOperation('delete', '体验课', '删除体验课: ' + delName, coachName);
  closeTrialModal();
  refreshData();
}

function toggleFollowUp(coachName, trialIdx, fKey) {
  const cd = mockData.coachDetail[coachName];
  if (!cd || !cd.trials || !cd.trials[trialIdx]) return;
  const t = cd.trials[trialIdx];
  if (!t.followUps) t.followUps = {};
  if (!t.followUps[fKey]) t.followUps[fKey] = {date:'',done:false};
  t.followUps[fKey].done = !t.followUps[fKey].done;
  if (!t.followUps[fKey].date && t.date) {
    const d = new Date(t.date);
    if (fKey==='nextDay') d.setDate(d.getDate()+1);
    else if (fKey==='threeDay') d.setDate(d.getDate()+3);
    else if (fKey==='oneMonth') d.setMonth(d.getMonth()+1);
    t.followUps[fKey].date = d.toISOString().slice(0,10);
  }
  refreshData();
}

function handleTrialImageUpload(coachName, trialIdx, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert('图片大小不能超过5MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const cd = mockData.coachDetail[coachName];
    if (cd && cd.trials && cd.trials[trialIdx]) {
      if (!cd.trials[trialIdx].images) cd.trials[trialIdx].images = [];
      cd.trials[trialIdx].images.push(e.target.result);
      renderTrialModal(cd.trials[trialIdx]);
    }
  };
  reader.readAsDataURL(file);
}

function removeTrialImage(coachName, trialIdx, imgIdx) {
  const cd = mockData.coachDetail[coachName];
  if (cd && cd.trials && cd.trials[trialIdx] && cd.trials[trialIdx].images) {
    cd.trials[trialIdx].images.splice(imgIdx, 1);
    renderTrialModal(cd.trials[trialIdx]);
  }
}

function viewTrialImage(src) {
  const w = window.open('', '_blank', 'width=800,height=600');
  if (w) { w.document.write("<img src=\x27"+src.replace(/'/g,"\\'")+"\x27 style='max-width:100%;max-height:100vh;display:block;margin:auto'>"); w.document.close(); }
}

// Check follow-up reminders (integrated into existing alert system)
function checkTrialFollowUps() {
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  const reminders = [];
  Object.keys(mockData.coachDetail).forEach(function(coachName) {
    const cd = mockData.coachDetail[coachName];
    if (!cd.trials) return;
    cd.trials.forEach(function(t) {
      if (t.status !== 'pending') return;
      if (!t.followUps) return;
      ['nextDay','threeDay','oneMonth'].forEach(function(k) {
        const fu = t.followUps[k];
        if (!fu || !fu.date || fu.done) return;
        if (today >= fu.date) {
          const overdue = today > fu.date;
          const label = k==='nextDay'?'隔天回访':k==='threeDay'?'3天回访':'1个月回访';
          reminders.push({
            coach: coachName, member: t.name, type: overdue?'回访逾期':'回访提醒',
            detail: label+' ('+fu.date+')'+(overdue?' - 已逾期！':''),
            urgent: overdue
          });
        }
      });
    });
  });
  return reminders;
}
