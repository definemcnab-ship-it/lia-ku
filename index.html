<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门店经营数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
:root {
  --primary: #4f46e5; --primary-light: #e0e7ff; --success: #10b981; --success-light: #d1fae5;
  --warning: #f59e0b; --warning-light: #fef3c7; --danger: #ef4444; --danger-light: #fee2e2;
  --info: #3b82f6; --info-light: #dbeafe;
  --bg: #f1f5f9; --card: #fff; --text: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
  --sidebar-w: 220px; --header-h: 56px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
/* Sidebar */
.sidebar { width: var(--sidebar-w); background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: #fff; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; }
.sidebar-logo { padding: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-logo h1 { font-size: 17px; font-weight: 700; }
.sidebar-logo p { font-size: 11px; color: #94a3b8; margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.nav-section { padding: 8px 20px 4px; font-size: 10px; text-transform: uppercase; color: #64748b; letter-spacing: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; transition: all .15s; font-size: 14px; color: #94a3b8; border-left: 3px solid transparent; }
.nav-item:hover { background: rgba(255,255,255,.05); color: #e2e8f0; }
.nav-item.active { background: rgba(79,70,229,.2); color: #fff; border-left-color: var(--primary); font-weight: 600; }
.nav-item .icon { width: 20px; text-align: center; font-size: 16px; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; color: #64748b; }
/* Main */
.main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.header { height: var(--header-h); background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.store-select { border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; background: #fff; cursor: pointer; }
.time-filter { display: flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 3px; }
.time-btn { padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; background: transparent; color: var(--text-secondary); font-weight: 500; transition: all .15s; }
.time-btn:hover { color: var(--text); }
.time-btn.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: 600; }
.date-range { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.date-range input { border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 11px; width: 118px; }
.query-btn { padding: 4px 10px; border: 1px solid var(--primary); border-radius: 6px; background: var(--primary); color: #fff; cursor: pointer; font-size: 11px; white-space: nowrap; }
.query-btn:hover { opacity: .85; }
.icon-btn { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 14px; line-height: 1; transition: all .15s; }
.icon-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
.content { padding: 20px 24px; flex: 1; }
/* Cards */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--card); border-radius: 12px; padding: 18px 20px; border: 1px solid var(--border); position: relative; overflow: hidden; }
.stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .change { font-size: 12px; margin-top: 4px; }
.stat-card .change.up { color: var(--success); }
.stat-card .change.down { color: var(--danger); }
.stat-card .spark { position: absolute; right: 12px; bottom: 12px; height: 40px; width: 80px; }
.alert-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--danger-light); color: var(--danger); padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-row.three { grid-template-columns: 1fr 1fr 1fr; }
.chart-row.wide-left { grid-template-columns: 2fr 1fr; }
.chart-row.wide-right { grid-template-columns: 1fr 2fr; }
.chart-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 16px; }
.chart-card.full { grid-column: 1/-1; }
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.chart-card h3 .badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 500; }
.badge.info { background: var(--info-light); color: var(--info); }
.badge.success { background: var(--success-light); color: var(--success); }
.badge.warning { background: var(--warning-light); color: var(--warning); }
.badge.danger { background: var(--danger-light); color: var(--danger); }
.chart-box { width: 100%; }
/* Tables */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { background: var(--bg); padding: 10px 12px; text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); border-bottom: 2px solid var(--border); white-space: nowrap; }
.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
.data-table tr:hover td { background: #f8fafc; }
.table-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
.table-card h3 { font-size: 14px; font-weight: 600; padding: 16px; border-bottom: 1px solid var(--border); margin: 0; }
.table-wrap { overflow-x: auto; padding: 0; }
/* Section */
.section { display: none; }
.section.active { display: block; }
/* Diagnosis Panel */
.diagnosis-panel { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; }
.diagnosis-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.diagnosis-list { padding: 12px 20px; }
.diagnosis-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bg); }
.diagnosis-item:last-child { border-bottom: none; }
.diagnosis-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.diagnosis-icon.danger { background: var(--danger-light); }
.diagnosis-icon.warning { background: var(--warning-light); }
.diagnosis-icon.success { background: var(--success-light); }
.diagnosis-icon.info { background: var(--info-light); }
.diagnosis-body { flex: 1; }
.diagnosis-body .title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.diagnosis-body .detail { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.diagnosis-action { padding: 5px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; }
.diagnosis-action.warn { background: var(--warning-light); color: #92400e; }
.diagnosis-action.danger { background: var(--danger-light); color: var(--danger); }
/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 16px; width: 90%; max-width: 800px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 16px; }
.modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: var(--bg); cursor: pointer; font-size: 18px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
/* Tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-high { background: var(--danger-light); color: var(--danger); }
.tag-mid { background: var(--warning-light); color: #92400e; }
.tag-low { background: var(--success-light); color: var(--success); }
/* Responsive */
@media (max-width: 1200px) {
  .chart-row { grid-template-columns: 1fr; }
  .chart-row.three, .chart-row.wide-left, .chart-row.wide-right { grid-template-columns: 1fr; }
}
.site-footer { text-align: center; padding: 20px; color: var(--text-secondary); font-size: 11px; border-top: 1px solid var(--border); }
/* Pulse */
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
.pulse { animation: pulse 2s infinite; }
/* Import UI */
.import-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.import-bar .portal-title { font-size: 18px; font-weight: 700; }
.import-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
.import-btn:hover { background: #4338ca; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(79,70,229,.3); }
.import-btn.outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.import-btn.outline:hover { background: var(--primary-light); box-shadow: none; }
.import-btn.sm { padding: 4px 10px; font-size: 11px; }
.import-actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* Drop Zone */
.drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .2s; margin: 16px 0; background: var(--bg); }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--primary); background: var(--primary-light); }
.drop-zone .drop-icon { font-size: 40px; margin-bottom: 10px; }
.drop-zone .drop-text { font-size: 14px; color: var(--text-secondary); }
.drop-zone .drop-hint { font-size: 11px; color: #94a3b8; margin-top: 6px; }
/* File Preview */
.file-preview { background: var(--bg); border-radius: 8px; padding: 12px 16px; margin: 12px 0; display: flex; align-items: center; justify-content: space-between; }
.file-preview .file-info { display: flex; align-items: center; gap: 10px; }
.file-preview .file-icon { font-size: 24px; }
.file-preview .file-name { font-size: 13px; font-weight: 600; }
.file-preview .file-size { font-size: 11px; color: var(--text-secondary); }
/* Mapping Table */
.mapping-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 12px 0; }
.mapping-table th { background: var(--bg); padding: 8px; text-align: left; font-weight: 600; font-size: 11px; color: var(--text-secondary); }
.mapping-table td { padding: 8px; border-bottom: 1px solid var(--border); }
.mapping-table select { padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 11px; background: #fff; }
/* Import Status */
.import-status { padding: 10px 16px; border-radius: 8px; font-size: 13px; margin: 12px 0; }
.import-status.success { background: var(--success-light); color: #065f46; }
.import-status.error { background: var(--danger-light); color: var(--danger); }
.import-status.info { background: var(--info-light); color: #1e40af; }
/* Data Source Badge */
.data-source-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--success-light); color: #065f46; border-radius: 4px; font-size: 10px; font-weight: 600; }
.overview-section-header { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 6px; }
/* Combined Stat Card */
.combined-card { border-left: 3px solid transparent; }
.combined-card.sales { border-left-color: var(--primary); }
.combined-card.ops { border-left-color: var(--success); }
/* Score Ring */
.score-ring { display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; font-weight: 700; font-size: 18px; }
.score-ring.good { background: var(--success-light); color: #065f46; }
.score-ring.warn { background: var(--warning-light); color: #92400e; }
.score-ring.bad { background: var(--danger-light); color: var(--danger); }
/* Coach Sub-Tabs */
.coach-subtabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.coach-subtab { flex: 1; padding: 10px 16px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all .15s; border: none; background: transparent; }
.coach-subtab:hover { color: var(--text); }
.coach-subtab.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.coach-subtab .count { font-size: 10px; display: block; color: inherit; opacity: .7; }
/* Coach Filter */
.coach-filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.coach-filter-bar select { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; min-width: 180px; cursor: pointer; }
.coach-summary-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 16px; }
.coach-summary-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 14px 16px; cursor: pointer; transition: all .15s; }
.coach-summary-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.coach-summary-card.selected { border-color: var(--primary); background: var(--primary-light); }
.coach-summary-card .coach-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.coach-summary-card .coach-stats { display: flex; gap: 16px; font-size: 11px; color: var(--text-secondary); flex-wrap: wrap; }
.coach-summary-card .alert-row { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
/* Alert Pill */
.alert-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.alert-pill.red { background: var(--danger-light); color: var(--danger); }
.alert-pill.orange { background: var(--warning-light); color: #92400e; }
.alert-pill.blue { background: var(--info-light); color: var(--info); }
/* Form */
.member-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.member-form .form-group { display: flex; flex-direction: column; }
.member-form .form-group label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; font-weight: 600; }
.member-form .form-group input, .member-form .form-group select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
.member-form .form-group.full { grid-column: 1/-1; }
.member-form .form-section { grid-column: 1/-1; font-size: 13px; font-weight: 700; padding: 8px 0 4px; margin-top: 8px; border-top: 1px solid var(--border); color: var(--primary); }
/* Trial Conversion */
.trial-track { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; margin: 4px 0; font-size: 12px; }
.trial-track.pending { background: var(--bg); }
.trial-track.converted { background: var(--success-light); }
.trial-track.lost { background: var(--danger-light); }
/* Renewal Board */
.renewal-card { border-left: 3px solid var(--border); padding: 10px 14px; margin: 6px 0; border-radius: 0 8px 8px 0; font-size: 12px; }
.renewal-card.urgent { border-left-color: var(--danger); background: #fef2f2; }
.renewal-card.normal { border-left-color: var(--warning); background: #fffbeb; }
.renewal-card.done { border-left-color: var(--success); background: #f0fdf4; }
/* Training Suggestion */
.training-box { background: var(--primary-light); border-radius: 10px; padding: 14px 18px; margin: 8px 0; }
.training-box h4 { font-size: 13px; color: var(--primary); margin-bottom: 6px; }
.training-box ul { margin: 0; padding-left: 18px; font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
/* Sales Channel Cards */
.sales-subtabs { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
.sales-subtab { flex: 1; padding: 10px 16px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: all .15s; border: none; background: transparent; }
.sales-subtab:hover { color: var(--text); }
.sales-subtab.active { background: #fff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 16px; }
.channel-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: all .15s; }
.channel-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(79,70,229,.08); transform: translateY(-1px); }
.channel-card.selected { border-color: var(--primary); border-width: 2px; box-shadow: 0 4px 20px rgba(79,70,229,.15); }
.channel-card .ch-header { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bg); }
.channel-card .ch-name { font-size: 14px; font-weight: 700; }
.channel-card .ch-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; }
.channel-card .ch-body { padding: 12px 16px; }
.channel-card .ch-row { display: flex; justify-content: space-between; font-size: 12px; margin: 4px 0; }
.channel-card .ch-row .val { font-weight: 600; }
.channel-card .ch-intent { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.intent-tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
.intent-a { background: #d1fae5; color: #065f46; }
.intent-b { background: #dbeafe; color: #1e40af; }
.intent-c { background: #fef3c7; color: #92400e; }
.intent-d { background: #f3f4f6; color: #6b7280; }
/* Analysis Panel */
.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.analysis-box { background: var(--bg); border-radius: 10px; padding: 14px; }
.analysis-box h4 { font-size: 12px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.reason-list { list-style: none; padding: 0; }
.reason-list li { font-size: 11px; padding: 4px 0; display: flex; align-items: flex-start; gap: 6px; color: var(--text-secondary); line-height: 1.5; border-bottom: 1px solid rgba(0,0,0,.04); }
.reason-list li .reason-bar { height: 6px; border-radius: 3px; margin-top: 5px; min-width: 40px; }
/* Lead Table Enhancements */
.lead-status { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.lead-status.won { background: #d1fae5; color: #065f46; }
.lead-status.lost { background: #fee2e2; color: var(--danger); }
.lead-status.follow { background: #fef3c7; color: #92400e; }
.lead-status.new { background: #dbeafe; color: #1e40af; }
/* Cross-portal bind indicator */
.portal-bind { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; margin-left: 4px; cursor: pointer; }
.portal-bind.coach { background: #ede9fe; color: #7c3aed; }
.portal-bind.member { background: #dbeafe; color: #2563eb; }
.portal-bind.ops { background: #fce7f3; color: #db2777; }
/* Conversion Funnel Detail */
.conv-detail-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.conv-detail-card { background: var(--card); border-radius: 10px; border: 1px solid var(--border); padding: 14px; text-align: center; }
.conv-detail-card .conv-num { font-size: 28px; font-weight: 700; }
.conv-detail-card .conv-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
/* Edit Mode */
.edit-toggle-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; border: 2px solid var(--border); background: #fff; color: var(--text-secondary); }
.edit-toggle-btn:hover { border-color: var(--warning); color: #92400e; }
.edit-toggle-btn.active { background: #fef3c7; border-color: var(--warning); color: #92400e; box-shadow: 0 0 0 3px rgba(245,158,11,.15); animation: pulse 2s infinite; }
.editable-cell { position: relative; transition: all .15s; cursor: text; }
.editable-cell:hover { background: #fef9c3 !important; outline: 2px dashed var(--warning); outline-offset: -2px; border-radius: 4px; }
.editable-cell:focus { background: #fef9c3 !important; outline: 2px solid var(--warning); outline-offset: -2px; border-radius: 4px; }
.stat-value-editable { cursor: pointer; transition: all .15s; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; }
.stat-value-editable:hover { background: #fef9c3; outline: 2px dashed var(--warning); }
.row-action-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; background: #fff; transition: all .12s; padding: 0; margin: 0 2px; }

      // Deep merge saved data into mockData
      Object.keys(data).forEach(function(k) {
        if (typeof data[k] === 'object' && data[k] !== null && !Array.isArray(data[k])) {
          Object.assign(mockData[k], data[k]);
        } else {
          mockData[k] = data[k];
        }
      });
      console.log('Data restored from localStorage');
    }
  } catch(e) { console.warn('localStorage load failed:', e); }

  // Load operation log
  try {
    var savedLog = localStorage.getItem(LOG_KEY);
    if (savedLog) operationLog = JSON.parse(savedLog);
  } catch(e) { operationLog = []; }
}

function resetAllData() {
  if (confirm('确定要恢复默认数据吗？所有修改将丢失，此操作不可撤销。')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(LOG_KEY);
    operationLog = [];
    location.reload();
  }
}

// ==================== OPERATION LOG ====================
function logOperation(type, entity, detail, target) {
  var entry = {
    id: Date.now(),
    time: new Date().toLocaleString('zh-CN'),
    type: type, // 'add' | 'edit' | 'delete' | 'import'
    entity: entity, // '会员' | '线索' | '体验课' | '续单' | '目标' | etc.
    detail: detail,
    target: target || ''
  };
  operationLog.unshift(entry);
  // Keep last 200 entries
  if (operationLog.length > 200) operationLog.length = 200;
  try {
    localStorage.setItem(LOG_KEY, JSON.stringify(operationLog));
  } catch(e) {}
  notifyChange();
}

}

      if (t.name.toLowerCase().includes(query) || (t.type||'').toLowerCase().includes(query)) {
        var icon = t.status === 'converted' ? '✅' : t.status === 'lost' ? '❌' : '⏳';
        items.push({ icon: icon, type: '体验课', name: t.name, desc: cn + ' | ' + (t.type||'') + ' | ' + t.date, action: 'switchPortal(' + q + 'coach' + q + ')' });

    });

  items = items.slice(0, 30);

  if (items.length === 0) {
    results.innerHTML = '<div class="sr-none">未找到匹配结果</div>';
  } else {

    });

  }

let currentTimePeriod = 'month';

function switchTimePeriod(period) {
  currentTimePeriod = period;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  const targetBtn = document.querySelector('.time-btn[data-period="' + period + '"]');

function getPeriodData() {
  const d = mockData;
  const p = currentTimePeriod;
  const t = d.timePeriods.targets[p] || 0;
  const a = d.timePeriods.actuals[p] || 0;
  const lp = d.timePeriods.lastPeriods[p] || 0;
  return {
    target: t,
    actual: a,
    lastPeriod: lp,
    completionRate: t > 0 ? Math.round(a / t * 1000) / 10 : 0,
    growthRate: lp > 0 ? Math.round((a - lp) / lp * 1000) / 10 : 0
  };
}

function updatePeriodTarget(period, value) {
  var newVal = parseInt(value) || 0;
  var oldVal = mockData.timePeriods.targets[period];
  mockData.timePeriods.targets[period] = newVal;
  cascadePeriodUpdate(period);
  logOperation('edit', '目标', '修改' + getPeriodLabel(period) + '目标: ¥' + oldVal.toLocaleString() + ' → ¥' + newVal.toLocaleString());
  refreshData();
}

function updatePeriodActual(period, value) {
  var newVal = parseInt(value) || 0;
  var oldVal = mockData.timePeriods.actuals[period];
  mockData.timePeriods.actuals[period] = newVal;
  cascadePeriodUpdate(period);
  logOperation('edit', '实际值', '修改' + getPeriodLabel(period) + '实际完成: ¥' + oldVal.toLocaleString() + ' → ¥' + newVal.toLocaleString());
  refreshData();
}

function cascadePeriodUpdate(changedPeriod) {
  var d = mockData.timePeriods;
  var order = ['day', 'week', 'month', 'quarter', 'year'];
  var multipliers = { day_week: 7, week_month: 4.33, month_quarter: 3, quarter_year: 4 };
  var idx = order.indexOf(changedPeriod);
  if (idx < 0) return;
  // Cascade both targets and actuals upward from the changed period
  for (var i = idx; i < order.length - 1; i++) {
    var curr = order[i], next = order[i + 1];
    var key = curr + '_' + next;
    var mult = multipliers[key] || 1;
    d.targets[next] = Math.round(d.targets[curr] * mult);
    d.actuals[next] = Math.round(d.actuals[curr] * mult);
  }
  // Also cascade lastPeriods for proper growth rate calculation
  for (var i = idx; i < order.length - 1; i++) {
    var curr = order[i], next = order[i + 1];
    var key = curr + '_' + next;
    var mult = multipliers[key] || 1;
    d.lastPeriods[next] = Math.round(d.lastPeriods[curr] * mult);
  }
  // Sync the legacy revenue object for backward compatibility
  mockData.revenue.target = d.targets.month;
  mockData.revenue.current = d.actuals.month;
  mockData.revenue.lastPeriod = d.lastPeriods.month;
  mockData.revenue.dailyGoal = d.targets.day;
}

function saveTableCellEdit(td) {
  td.style.background = '#fef3c7';
}

function addTableRow(table, ctx) {
  const tbody = table.querySelector('tbody');
  if (!tbody) return;
  const existingRow = tbody.querySelector('tr');
  if (!existingRow) return;
  const cells = existingRow.querySelectorAll('td');
  const tr = document.createElement('tr');
  for (let i = 0; i < cells.length; i++) {
    const td = document.createElement('td');
    td.className = 'editable-cell';
    td.contentEditable = 'true';
    td.textContent = i === 0 ? '新增' : '--';
    td.addEventListener('blur', function() { saveTableCellEdit(td); });
    tr.appendChild(td);
  }
  tbody.appendChild(tr);
  tr.scrollIntoView({ behavior: 'smooth' });
  addMockDataRow(ctx);
}

function showQuickEditForm(title, fields, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'quick-edit-overlay';
  overlay.innerHTML = `
    <div class="quick-edit-panel">
      <div class="qe-header">✏️ ${title}<button style="border:none;background:none;cursor:pointer;font-size:18px" onclick="this.closest('.quick-edit-overlay').remove()">✕</button></div>
      <div class="qe-body">
        ${fields.map((f,i) => `
          <div class="qe-field ${f.full?'full':''}">
            <label>${f.label}</label>
            ${f.type==='select' ? '<select id="qe_f_'+i+'">'+(f.options||[]).map(o=>'<option value="'+o.v+'"'+(o.sel?' selected':'')+'>'+o.t+'</option>').join('')+'</select>'
              : '<input type="'+(f.type||'text')+'" id="qe_f_'+i+'" value="'+(f.value||'')+'" placeholder="'+(f.placeholder||'')+'">'}
          </div>
        `).join('')}
      </div>
      <div class="qe-footer">
        <button style="padding:8px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600" id="qeSaveBtn">保存</button>
        <button style="padding:8px 16px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px" onclick="this.closest('.quick-edit-overlay').remove()">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.querySelector('#qeSaveBtn').onclick = function() {
    const vals = {};
    fields.forEach((f, i) => {
      const el = document.getElementById('qe_f_'+i);
      if (el) vals[f.key] = el.value;
    });
    onSave(vals);
    overlay.remove();
    // Extract entity type from title for logging
    var entityType = '数据';
    if (title.indexOf('会员') >= 0) entityType = '会员';
    else if (title.indexOf('体验课') >= 0) entityType = '体验课';
    else if (title.indexOf('续课') >= 0) entityType = '续课';
    else if (title.indexOf('教练') >= 0) entityType = '教练';
    logOperation('edit', entityType, title.replace('编辑', '').trim());
    refreshData();
  };
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

// ==================== CHART HELPERS ====================
function initChart(domId) {
  const dom = document.getElementById(domId);
  if (!dom) return null;
  const chart = echarts.init(dom);
  return chart;
}

const chartInstances = {};
function getChart(domId) {
  if (chartInstances[domId]) chartInstances[domId].dispose();
  const chart = initChart(domId);
  chartInstances[domId] = chart;
  return chart;
}

function renderPortal(portal) {
  const c = document.getElementById('content');
  switch(portal) {
    case 'overview': c.innerHTML = renderOverview(); break;
    case 'sales': c.innerHTML = renderSales(); break;
    case 'ops': c.innerHTML = renderOps(); break;
    case 'coach': c.innerHTML = renderCoach(); break;
    case 'member': c.innerHTML = renderMember(); break;
  }
  setTimeout(() => {
    switch(portal) {
      case 'overview': initOverviewCharts(); break;

      case 'ops': initOpsCharts(); break;
      case 'coach': initCoachCharts(); break;
      case 'member': initMemberCharts(); break;
    }

  }, 100);
}

// ==================== OVERVIEW (COMBINED SALES + OPS) ====================
function renderOverview() {
  const d = mockData;
  const revenuePct = d.revenue.current / d.revenue.target * 100;
  const sleepPct = d.memberActivity.sleep / d.memberActivity.total * 100;
  const avgConsumeRate = d.members.reduce((s,m)=>s+m.consumeRate,0) / d.members.length;
  const renewWindowCount = getFilteredMembers().filter(m=>m.renewWindow).length;
  const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30);
  const thirtyDaysAgoStr = thirtyDaysAgo.toISOString().slice(0,10);
  const riskMembers = d.members.filter(m=>m.consumeRate<50||(m.lastVisit&&m.lastVisit<thirtyDaysAgoStr)).length;

let salesActiveTab = 'new'; // 'new' | 'renewal'

let salesSelRenewCat = null; // null=all categories, string=specific category
let salesDateFilter = { from: null, to: null }; // Date range filter for sales page
let globalDateFilter = { from: null, to: null }; // Global date filter from header

function applyGlobalDateFilter() {
  var fromEl = document.getElementById('dateFrom');
  var toEl = document.getElementById('dateTo');
  globalDateFilter.from = fromEl && fromEl.value ? fromEl.value : null;
  globalDateFilter.to = toEl && toEl.value ? toEl.value : null;
  // Sync to sales date filter so overview can use filtered data
  salesDateFilter.from = globalDateFilter.from;
  salesDateFilter.to = globalDateFilter.to;
  refreshData();
}

function getFilteredNewLeads(nl) {
  var filtered = {};
  Object.keys(nl || {}).forEach(function(ch) {
    filtered[ch] = (nl[ch] || []).filter(function(l) {
      if (salesDateFilter.from && l.date < salesDateFilter.from) return false;
      if (salesDateFilter.to && l.date > salesDateFilter.to) return false;
      return true;
    });
  });
  return filtered;
}

function getFilteredRenewalLeads(rl) {
  var filtered = {};
  Object.keys(rl || {}).forEach(function(cat) {
    filtered[cat] = (rl[cat] || []).filter(function(l) {
      var d = l.date || l.expireDate || '';
      if (salesDateFilter.from && d < salesDateFilter.from) return false;
      if (salesDateFilter.to && d > salesDateFilter.to) return false;
      return true;
    });
  });
  return filtered;
}

function setSalesDateFilter() {
  var fromEl = document.getElementById('salesDateFrom');
  var toEl = document.getElementById('salesDateTo');
  salesDateFilter.from = fromEl && fromEl.value ? fromEl.value : null;
  salesDateFilter.to = toEl && toEl.value ? toEl.value : null;
  disposeAllCharts();
  document.getElementById('content').innerHTML = renderSales();
  initSalesCharts();
  setTimeout(applyEditMode, 50);
}

function clearSalesDateFilter() {
  salesDateFilter = { from: null, to: null };
  var fromEl = document.getElementById('salesDateFrom');
  var toEl = document.getElementById('salesDateTo');
  if (fromEl) fromEl.value = '';
  if (toEl) toEl.value = '';
  disposeAllCharts();
  document.getElementById('content').innerHTML = renderSales();
  initSalesCharts();
  setTimeout(applyEditMode, 50);
}

function exportSalesData() {
  var d = mockData;
  var nl = getFilteredNewLeads(d.salesLeads.newLeads);
  var rl = getFilteredRenewalLeads(d.salesLeads.renewalLeads);
  var rows = [['类型','渠道/分类','日期','姓名','电话','性别','教练','意向级别','成交状态','金额','转介绍人','剩余课时','余额','到期日']];
  // New leads
  Object.keys(nl).forEach(function(ch) {
    nl[ch].forEach(function(l) {
      rows.push(['新单',ch,l.date,l.name,l.phone,l.sex,l.coach,l.intent,l.converted?'已成交':'未成交',l.amount||0,l.referrer||'','','','']);
    });
  });
  // Renewal leads
  Object.keys(rl).forEach(function(cat) {
    rl[cat].forEach(function(l) {
      rows.push(['续单',cat,l.date||'',l.name,'','',l.coach,'',l.renewed?'已续单':l.contacted?'跟进中':'未续',l.amount||0,'',l.remain||'',l.balance||'',l.expireDate||'']);
    });
  });
  var BOM = '﻿';
  var csv = BOM + rows.map(function(r) { return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '销售数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function disposeAllCharts() {
  Object.values(chartInstances).forEach(c => { try { c.dispose(); } catch(e){} });
  for (const k in chartInstances) delete chartInstances[k];
}

function renderSales() {
  const d = mockData;
  const rawNl = d.salesLeads.newLeads;
  const rawRl = d.salesLeads.renewalLeads;
  const nl = getFilteredNewLeads(rawNl);
  const rl = getFilteredRenewalLeads(rawRl);

  // Aggregate stats from filtered data
  const newStats = { total:0, won:0, lost:0, pending:0, amount:0 };
  CHANNEL_KEYS.forEach(ch => {
    const leads = nl[ch] || [];
    newStats.total += leads.length;
    leads.forEach(l => {
      if (l.converted) { newStats.won++; newStats.amount += l.amount; }
      else { newStats.lost++; }
    });
  });
  const newConvRate = newStats.total > 0 ? (newStats.won/newStats.total*100) : 0;

        <div class="value" style="font-size:22px;color:${getPeriodData().growthRate>=0?'var(--success)':'var(--danger)'}">${getPeriodData().growthRate>=0?'+':''}${getPeriodData().growthRate}<span style="font-size:14px">%</span></div>
        <div class="change">较上期 | (本期-上期)/上期×100%</div>

function renderTrialSalesPanel() {
  const d = mockData;
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  
  // Calculate week range (Mon-Sun)
  const dayOfWeek = now.getDay();
  const monday = new Date(now); monday.setDate(now.getDate() - (dayOfWeek===0?6:dayOfWeek-1));
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  const mondayStr = monday.toISOString().slice(0,10);
  const sundayStr = sunday.toISOString().slice(0,10);
  
  // Calculate month range
  const monthStart = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
  const monthEnd = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10);
  
  // Calculate year range
  const yearStart = now.getFullYear()+'-01-01';
  const yearEnd = now.getFullYear()+'-12-31';
  
  // Aggregate all trials
  const allTrials = [];
  Object.keys(d.coachDetail).forEach(function(coachName) {
    const cd = d.coachDetail[coachName];
    if (!cd.trials) return;
    cd.trials.forEach(function(t, idx) {
      allTrials.push(Object.assign({}, t, {coachName: coachName, _origIdx: idx}));
    });
  });
  
  function filterByDateRange(trials, from, to) {
    return trials.filter(function(t) { return t.date >= from && t.date <= to; });
  }
  
  function calcStats(trials) {
    const total = trials.length;
    const converted = trials.filter(function(t){return t.status==='converted';});
    const pending = trials.filter(function(t){return t.status==='pending';});
    const lost = trials.filter(function(t){return t.status==='lost';});
    const amount = converted.reduce(function(s,t){return s+(t.amount||0);},0);
    const convRate = total>0?(converted.length/total*100):0;
    return {total:total, converted:converted.length, pending:pending.length, lost:lost.length, amount:amount, convRate:convRate};
  }
  
  const dayTrials = filterByDateRange(allTrials, todayStr, todayStr);
  const weekTrials = filterByDateRange(allTrials, mondayStr, sundayStr);
  const monthTrials = filterByDateRange(allTrials, monthStart, monthEnd);
  const yearTrials = filterByDateRange(allTrials, yearStart, yearEnd);
  
  const ds = calcStats(dayTrials);
  const ws = calcStats(weekTrials);
  const ms = calcStats(monthTrials);
  const ys = calcStats(yearTrials);
  
  function formatAmount(v) { return v>=10000?(v/10000).toFixed(1)+'万':'¥'+v.toLocaleString(); }
  
  function consultantBreakdown(trials, label) {
    if (trials.length===0) return '<div style="font-size:11px;color:var(--text-secondary);text-align:center;padding:8px">暂无'+label+'体验课数据</div>';
    const map = {};
    trials.forEach(function(t) {
      const sc = t.salesConsultant||t.coachName||'未分配';
      if (!map[sc]) map[sc] = {total:0,converted:0,pending:0,lost:0,amount:0};
      map[sc].total++;
      if (t.status==='converted') { map[sc].converted++; map[sc].amount+=(t.amount||0); }
      else if (t.status==='pending') map[sc].pending++;
      else map[sc].lost++;
    });
    const entries = Object.entries(map).sort(function(a,b){return b[1].total-a[1].total;});
    return entries.map(function(_a) {
      const name=_a[0], s=_a[1];
      const cr = s.total>0?(s.converted/s.total*100):0;
      return '<tr><td><strong>'+name.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</strong></td><td>'+s.total+'</td><td style="color:var(--success)">'+s.converted+'</td><td style="color:var(--warning)">'+s.pending+'</td><td style="color:var(--danger)">'+s.lost+'</td><td>'+formatPct(cr)+'</td><td style="color:var(--success)">'+(s.amount>0?'¥'+s.amount.toLocaleString():'--')+'</td></tr>';
    }).join('');
  }
  
  var panelTabs = ['day','week','month','year'];
  var panelLabels = {day:'📅 今日',week:'📆 本周',month:'🗓️ 本月',year:'📊 本年'};
  var activePanel = window._trialSalesPeriod || 'month';
  
  var statData = {day:ds, week:ws, month:ms, year:ys};
  var sd = statData[activePanel];
  var rangeLabels = {day:'今日('+todayStr+')', week:'本周('+mondayStr+' ~ '+sundayStr+')', month:'本月('+monthStart+' ~ '+monthEnd+')', year:'本年('+yearStart+' ~ '+yearEnd+')'};
  var periodTrials = {day:dayTrials, week:weekTrials, month:monthTrials, year:yearTrials};
  var pt = periodTrials[activePanel];
  
  var h = '';
  h += '<div class="overview-section-header">🧪 体验课数据分析 <span style="font-weight:400;font-size:11px;color:var(--text-secondary)">— 全店体验课转化追踪（点击周期切换）</span><button class="import-btn sm" style="margin-left:12px;background:var(--primary);color:#fff;padding:4px 12px;font-size:11px" onclick="event.stopPropagation();addTrialFromSales()">➕ 新增体验课</button></div>';
  
  // Period tabs
  h += '<div style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap">';
  panelTabs.forEach(function(k) {
    h += '<button style="padding:6px 16px;border:1px solid '+(activePanel===k?'var(--primary)':'var(--border)')+';border-radius:8px;background:'+(activePanel===k?'var(--primary-light)':'#fff')+';color:'+(activePanel===k?'var(--primary)':'var(--text-secondary)')+';cursor:pointer;font-size:12px;font-weight:'+(activePanel===k?'600':'400')+';transition:all .15s" onclick="window._trialSalesPeriod=\x27'+k+'\x27;refreshData()">'+panelLabels[k]+'</button>';
  });
  h += '</div>';
  
  // Period summary cards
  h += '<div class="stat-row">';
  panelTabs.forEach(function(k) {
    var s = statData[k];
    h += '<div class="stat-card" style="border-left:3px solid '+(k===activePanel?'var(--primary)':'var(--border)')+';cursor:pointer;opacity:'+(k===activePanel?'1':'0.7')+'" onclick="window._trialSalesPeriod=\x27'+k+'\x27;refreshData()">';
    h += '<div class="label">'+panelLabels[k]+'</div>';
    h += '<div class="value" style="font-size:18px">'+s.total+'<span style="font-size:11px">条</span></div>';
    h += '<div class="change" style="font-size:10px">✅'+s.converted+' ⏳'+s.pending+' ❌'+s.lost+' | 转化率'+formatPct(s.convRate)+'</div>';
    h += '</div>';
  });
  h += '</div>';
  
  // Active period detail
  h += '<div class="chart-row"><div class="chart-card full">';
  h += '<h3>🔍 '+rangeLabels[activePanel]+' — 体验课详细数据</h3>';
  
  // Mini stat bar for active period
  h += '<div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">';
  h += '<div style="flex:1;min-width:100px;text-align:center;padding:12px;background:var(--bg);border-radius:8px"><div style="font-size:20px;font-weight:700">'+sd.total+'</div><div style="font-size:10px;color:var(--text-secondary)">体验课总数</div></div>';
  h += '<div style="flex:1;min-width:100px;text-align:center;padding:12px;background:#d1fae5;border-radius:8px"><div style="font-size:20px;font-weight:700;color:var(--success)">'+sd.converted+'</div><div style="font-size:10px;color:#065f46">已转化</div></div>';
  h += '<div style="flex:1;min-width:100px;text-align:center;padding:12px;background:#fef3c7;border-radius:8px"><div style="font-size:20px;font-weight:700;color:var(--warning)">'+sd.pending+'</div><div style="font-size:10px;color:#92400e">跟进中</div></div>';
  h += '<div style="flex:1;min-width:100px;text-align:center;padding:12px;background:#fee2e2;border-radius:8px"><div style="font-size:20px;font-weight:700;color:var(--danger)">'+sd.lost+'</div><div style="font-size:10px;color:#991b1b">流失</div></div>';
  h += '<div style="flex:1;min-width:100px;text-align:center;padding:12px;background:var(--primary-light);border-radius:8px"><div style="font-size:20px;font-weight:700;color:var(--primary)">'+formatPct(sd.convRate)+'</div><div style="font-size:10px;color:var(--text-secondary)">转化率</div></div>';
  h += '<div style="flex:1;min-width:120px;text-align:center;padding:12px;background:#d1fae5;border-radius:8px"><div style="font-size:18px;font-weight:700;color:var(--success)">'+(sd.amount>0?'¥'+sd.amount.toLocaleString():'--')+'</div><div style="font-size:10px;color:#065f46">转化金额</div></div>';
  h += '</div>';
  
  // Sales consultant breakdown table
  h += '<h4 style="font-size:13px;margin-bottom:8px;color:var(--text)">👤 销售顾问/教练体验课统计</h4>';
  h += '<div class="table-wrap"><table class="data-table">';
  h += '<thead><tr><th>销售顾问/教练</th><th>体验总数</th><th>✅ 已转化</th><th>⏳ 跟进中</th><th>❌ 流失</th><th>转化率</th><th>转化金额</th></tr></thead>';
  h += '<tbody>'+consultantBreakdown(pt, rangeLabels[activePanel])+'</tbody>';
  h += '</table></div>';
  
  // Trial detail list
  if (pt.length > 0) {
    h += '<h4 style="font-size:13px;margin:12px 0 8px;color:var(--text)">📋 '+rangeLabels[activePanel]+'体验课明细</h4>';
    h += '<div style="max-height:300px;overflow-y:auto"><table class="data-table">';
    h += '<thead><tr><th>会员</th><th>日期</th><th>课程类型</th><th>销售顾问</th><th>需求等级</th><th>状态</th><th>转化金额</th><th>回访状态</th><th>操作</th></tr></thead>';
    h += '<tbody>';
    pt.sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(t,i) {
      var fu = t.followUps||{};
      var fuStatus = '';
      if (t.status==='pending') {
        var fuParts = [];
        ['nextDay','threeDay','oneMonth'].forEach(function(k) {
          var f = fu[k]||{};
          var label = k==='nextDay'?'隔天':k==='threeDay'?'3天':'1月';
          if (f.done) fuParts.push('<span style="color:var(--success)">✅'+label+'</span>');
          else if (f.date) {
            var overdue = todayStr > f.date;
            fuParts.push('<span style="color:'+(overdue?'var(--danger)':'var(--warning)')+'">'+(overdue?'🔴':'🟡')+label+'</span>');
          } else fuParts.push('<span style="color:var(--text-secondary)">⬜'+label+'</span>');
        });
        fuStatus = fuParts.join(' ');
      }
      h += '<tr style="cursor:pointer" onclick="showTrialDetailModal(\x27'+t.coachName.replace(/'/g,"\\'")+'\x27,'+(t._origIdx||0)+');">';
      h += '<td><strong>'+t.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</strong></td>';
      h += '<td>'+t.date+'</td>';
      h += '<td>'+t.type+'</td>';
      h += '<td>'+(t.salesConsultant||t.coachName||'--')+'</td>';
      h += '<td>'+(t.preClass&&t.preClass.needLevel?t.preClass.needLevel:'--')+'</td>';
      h += '<td>'+(t.status==='converted'?'<span class="tag tag-low">✅已转化</span>':t.status==='pending'?'<span class="tag tag-mid">⏳跟进中</span>':'<span class="tag tag-high">❌流失</span>')+'</td>';
      h += '<td>'+(t.amount>0?'¥'+t.amount.toLocaleString():'--')+'</td>';
      h += '<td style="font-size:10px">'+fuStatus+'</td>';
      h += '<td><button class="import-btn sm outline" style="padding:2px 6px;font-size:10px" onclick="event.stopPropagation();showTrialDetailModal(\x27'+t.coachName.replace(/'/g,"\\'")+'\x27,'+(t._origIdx||0)+');">✏️</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }
  
  h += '</div></div>';
  return h;
}

// Add new trial from sales page
function addTrialFromSales() {
  var coaches = mockData.coaches || [];
  if (coaches.length === 0) { alert('请先添加教练'); return; }
  var coachName = coaches[0].name;
  if (coaches.length > 1) {
    var choice = prompt('请选择教练：\n' + coaches.map(function(c,i){ return (i+1)+'. '+c.name; }).join('\n'), '1');
    if (!choice) return;
    var idx = parseInt(choice) - 1;
    if (idx >= 0 && idx < coaches.length) coachName = coaches[idx].name;
  }
  var cd = mockData.coachDetail[coachName];
  if (!cd) { cd = {}; mockData.coachDetail[coachName] = cd; }
  if (!cd.trials) cd.trials = [];
  var today = new Date().toISOString().slice(0,10);
  var newTrial = {
    name: '新会员', date: today, type: '私教体验', status: 'pending', amount: 0,
    salesConsultant: coachName,
    prospectInfo: { occupation: '', age: 0, address: '', phone: '', wechat: '', source: '' },
    preClass: { needLevel: '中', physicalNeeds: '', mentalNeeds: '', dataNeeds: '', exerciseHistory: '', injuryHistory: '', coreMotivation: '', otherNotes: '' },
    duringClass: { actions: '', notes: '', coachFeedback: '' },
    closing: { phase1: '', phase2: '', phase3: '', product: '', price: 0, nonConvertReason: '' },
    images: [],
    followUps: { nextDay: { date: '', done: false }, threeDay: { date: '', done: false }, oneMonth: { date: '', done: false } }
  };
  cd.trials.push(newTrial);
  syncTrialAmountsToPeriods();
  syncCoachStats();
  logOperation('add', '体验课', '新增体验课: ' + newTrial.name, coachName);
  refreshData();
  setTimeout(function() { showTrialDetailModal(coachName, cd.trials.length - 1); }, 100);
}

// Sync trial conversion amounts to time period actuals
function syncTrialAmountsToPeriods() {
  var d = mockData;
  var now = new Date();
  var todayStr = now.toISOString().slice(0,10);
  var dayOfWeek = now.getDay();
  var monday = new Date(now); monday.setDate(now.getDate() - (dayOfWeek===0?6:dayOfWeek-1));
  var mondayStr = monday.toISOString().slice(0,10);
  var monthStart = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';
  var yearStart = now.getFullYear()+'-01-01';
  
  // Calculate total converted amount for each period from all trials
  var dayAmt = 0, weekAmt = 0, monthAmt = 0, yearAmt = 0;
  Object.keys(d.coachDetail).forEach(function(cn) {
    var cd = d.coachDetail[cn];
    if (!cd.trials) return;
    cd.trials.forEach(function(t) {
      if (t.status !== 'converted' || !t.amount) return;
      var td = t.date;
      if (td === todayStr) dayAmt += t.amount;
      if (td >= mondayStr && td <= todayStr) weekAmt += t.amount;
      if (td >= monthStart && td <= todayStr) monthAmt += t.amount;
      if (td >= yearStart && td <= todayStr) yearAmt += t.amount;
    });
  });
  
  // Update actuals based on real trial data + any manual adjustments
  // Only update if there are actual trial amounts
  if (dayAmt > 0 || weekAmt > 0 || monthAmt > 0 || yearAmt > 0) {
    // Preserve the base actuals (manual inputs) by keeping the max of trial amounts and current actuals
    var td = d.timePeriods;
    if (dayAmt > 0) td.actuals.day = Math.max(td.actuals.day || 0, dayAmt);
    if (weekAmt > 0) td.actuals.week = Math.max(td.actuals.week || 0, weekAmt);
    if (monthAmt > 0) td.actuals.month = Math.max(td.actuals.month || 0, monthAmt);
    if (yearAmt > 0) td.actuals.year = Math.max(td.actuals.year || 0, yearAmt);
  }
}

function getBestChannel(nl) {
  let best = '', bestRate = 0;
  CHANNEL_KEYS.forEach(ch => {
    const leads = nl[ch]||[];
    const rate = leads.length>0?leads.filter(l=>l.converted).length/leads.length*100:0;
    if (rate > bestRate) { bestRate = rate; best = ch; }
  });
  return best || '--';
}
function getWorstChannel(nl) {
  let worst = '', worstRate = 100;
  CHANNEL_KEYS.forEach(ch => {
    const leads = nl[ch]||[];
    const rate = leads.length>0?leads.filter(l=>l.converted).length/leads.length*100:0;
    if (rate < worstRate && leads.length>0) { worstRate = rate; worst = ch; }
  });
  return worst || '--';
}

function initSalesCharts() {

function initNewSalesCharts(d) {
  if (salesSelChannel) return; // No charts in channel drill-down

  const c1 = getChart('salesChannelCompare');
  if (c1) c1.setOption({
    tooltip:{trigger:'axis'},
    legend:{data:['线索数','已成交','未成交'],bottom:0,textStyle:{fontSize:10}},
    grid:{left:45,right:20,top:10,bottom:35},

function getPeriodLabel(period) {
  var labels = { day: '今日', week: '本周', month: '本月', quarter: '本季', year: '年度' };
  return labels[period] || '本月';
}

function editPeriodTarget(period) {
  var current = mockData.timePeriods.targets[period] || 0;
  var input = prompt('修改' + getPeriodLabel(period) + '目标金额（¥）：', current);
  if (input !== null) {
    updatePeriodTarget(period, parseInt(input) || 0);
  }
}

function editPeriodActual(period) {
  var current = mockData.timePeriods.actuals[period] || 0;
  var input = prompt('修改' + getPeriodLabel(period) + '实际完成金额（¥）：', current);
  if (input !== null) {
    updatePeriodActual(period, parseInt(input) || 0);
  }
}

      const now3 = new Date(); const today3 = now3.toISOString().slice(0,10);

      if (fu2.nextDay && fu2.nextDay.date && !fu2.nextDay.done && today3 > fu2.nextDay.date)
        allAlerts.push({coach:c.name,member:t.name,type:'回访逾期',detail:`隔天回访逾期(${fu2.nextDay.date})，需立即跟进`,urgent:true});

        allAlerts.push({coach:c.name,member:t.name,type:'回访逾期',detail:`3天回访逾期(${fu2.threeDay.date})，需立即跟进`,urgent:true});
      if (fu2.oneMonth && fu2.oneMonth.date && !fu2.oneMonth.done && today3 > fu2.oneMonth.date)
        allAlerts.push({coach:c.name,member:t.name,type:'回访逾期',detail:`1个月回访逾期(${fu2.oneMonth.date})，需立即跟进`,urgent:true});
    });
  });
  const renewalAlerts = [];
  d.coaches.forEach(c => {
    const cd = d.coachDetail[c.name];
    if (!cd) return;
    cd.renewals.filter(r=>r.status==='urgent').forEach(r => renewalAlerts.push({coach:c.name,member:r.name,balance:r.balance,remaining:r.remaining,suggestion:r.suggestion}));

  const filteredCoaches = selectedCoach === 'all' ? d.coaches : d.coaches.filter(c=>c.name===selectedCoach);

  const coachAlertMap = {};

    const cd = d.coachDetail[c.name];

    coachAlertMap[c.name] = {
      lowFreq: cd.members.filter(m=>m.alert).length,
      trialPending: cd.trials.filter(t=>t.status==='pending').length,
      renewalUrgent: cd.renewals.filter(r=>r.status==='urgent').length,
      renewalNormal: cd.renewals.filter(r=>r.status==='normal').length
    };
  });

  return `

        <option value="all" ${selectedCoach==='all'?'selected':''}>全部教练（店长视角）</option>
        ${d.coaches.map(c => `<option value="${c.name}" ${selectedCoach===c.name?'selected':''}>${c.name} — 完成率${formatPct(c.actual/c.target*100)}</option>`).join('')}

}

function addCoach() {
  var name = prompt('请输入新教练姓名：', '');
  if (!name || !name.trim()) return;
  name = name.trim();
  var d = mockData;
  // Check if coach already exists
  if (d.coaches.find(function(c) { return c.name === name; })) {
    alert('教练 "' + name + '" 已存在！');
    return;
  }
  // Add to coaches array
  d.coaches.push({
    name: name, target: 100000, actual: 0, renewRate: 0, students: 0,
    consumeRate: 0, satisfaction: 5.0, birthday: ''
  });
  // Add to coachDetail
  d.coachDetail[name] = {
    revenueTrend: [0,0,0,0,0],
    classVolume: { tuan: 0, small: 0, private: 0, featured: 0 },
    members: [],
    trials: [],
    renewals: [],
    weaknesses: [],
    trainings: [],
    hexagon: [50, 50, 50, 50, 50, 50]
  };
  // Add to coachConsumption
  ['day', 'week', 'month'].forEach(function(period) {
    if (!d.coachConsumption[period]) d.coachConsumption[period] = {};
    d.coachConsumption[period][name] = { private: 0, small: 0, featured: 0, tuan: 0 };
  });
  alert('✅ 教练 "' + name + '" 已添加');
  logOperation('add', '教练', '添加教练: ' + name);
  refreshData();
}

function deleteCoach(name) {
  if (!confirm('确定要删除教练 "' + name + '" 吗？\n\n该操作将同时删除该教练的所有相关数据（会员将变为无主教练状态）。')) return;
  var d = mockData;
  // Remove from coaches array
  d.coaches = d.coaches.filter(function(c) { return c.name !== name; });
  // Remove from coachDetail
  delete d.coachDetail[name];
  // Remove from coachConsumption
  ['day', 'week', 'month'].forEach(function(period) {
    if (d.coachConsumption[period]) delete d.coachConsumption[period][name];
  });
  // Unassign coach from members
  d.members.forEach(function(m) {
    if (m.coach === name) m.coach = '';
  });
  // Reset selection if deleted coach was selected
  if (selectedCoach === name) selectedCoach = 'all';
  alert('✅ 教练 "' + name + '" 已删除，相关会员已解绑');
  logOperation('delete', '教练', '删除教练: ' + name);
  refreshData();
}

function switchCoachTab(tab) {
  if (Object.values(chartInstances).length > 0) {
    Object.values(chartInstances).forEach(c => { try { c.dispose(); } catch(e){} });
  }
  for (const k in chartInstances) delete chartInstances[k];
  coachActiveTab = tab;
  const c = document.getElementById('content');
  c.innerHTML = renderCoach();
  if (tab === 'hexagon') {
    setTimeout(initHexagonCharts, 100);
  } else {
    initCoachCharts();
  }
  setTimeout(applyEditMode, 50);
}

function selectCoach(name) {
  if (Object.values(chartInstances).length > 0) {
    Object.values(chartInstances).forEach(c => { try { c.dispose(); } catch(e){} });
  }
  for (const k in chartInstances) delete chartInstances[k];
  selectedCoach = name;
  const c = document.getElementById('content');
  c.innerHTML = renderCoach();
  initCoachCharts();
  setTimeout(applyEditMode, 50);
}

                  <span style="font-size:11px">${t.type}</span>
                  ${statusBadge(t.status)}
                  ${t.preClass&&t.preClass.needLevel ? needBadge(t.preClass.needLevel) : ''}
                </div>
                <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">

                  ${t.amount>0?'<span style="font-size:12px;font-weight:600;color:var(--success)">¥'+t.amount.toLocaleString()+'</span>':''}
                </div>
              </div>
              ${t.status==='pending' && t.followUps ? `
                <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;font-size:10px">
                  ${['nextDay','threeDay','oneMonth'].map(k => {
                    const fu = t.followUps[k];
                    if (!fu || !fu.date) return '';
                    const overdue = todayStr2 > fu.date && !fu.done;
                    const done = fu.done;
                    const label = k==='nextDay'?'隔天回访':k==='threeDay'?'3天回访':'1个月回访';
                    return '<span class="follow-up-tag" style="display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:10px;background:'+(done?'#d1fae5':overdue?'#fee2e2':'#fef3c7')+';color:'+(done?'#065f46':overdue?'#991b1b':'#92400e')+'" onclick="event.stopPropagation();toggleFollowUp(\x27'+c.name.replace(/'/g,"\\'")+'\x27,'+i+',\x27'+k+'\x27)" title="'+(done?'已完成':overdue?'已逾期！点击标记完成':'待完成')+': '+fu.date+'">'+(done?'✅':overdue?'🔴':'🟡')+' '+label+' '+fu.date+'</span>';
                  }).join('')}
                </div>` : ''}
              ${t.status==='lost' && t.closing && t.closing.nonConvertReason ? '<div style="margin-top:4px;font-size:10px;color:var(--danger)">💬 流失原因：'+t.closing.nonConvertReason.slice(0,80)+(t.closing.nonConvertReason.length>80?'...':'')+'</div>' : ''}
              ${t.status==='converted' && t.closing && t.closing.product ? '<div style="margin-top:4px;font-size:10px;color:var(--success)">🏆 转化：'+t.closing.product+' ¥'+(t.closing.price||t.amount||0).toLocaleString()+'</div>' : ''}

          `).join('')}

      </div>
    </div>
  `;
}

function initSingleCoachCharts(d, coachName) {
  const cd = d.coachDetail[coachName];
  if (!cd) return;

  if (coachActiveTab === 'revenue') {
    initCoachRevenueCharts(d, coachName, cd);
  } else if (coachActiveTab === 'sales') {
    initCoachSalesCharts(d, coachName, cd);
  } else if (coachActiveTab === 'renewal') {
    initCoachRenewalCharts(d, coachName, cd);
  }
}

function saveMember(id) {
  const m = mockData.members.find(x=>x.id===id);
  if (!m) return;
  const getVal = (f, def) => { const el = document.getElementById('edit_'+f); return el ? el.value : def; };
  m.name = getVal('name', m.name);
  m.sex = getVal('sex', m.sex);
  m.age = parseInt(getVal('age', m.age)) || m.age;
  m.birthday = getVal('birthday', m.birthday);
  m.phone = getVal('phone', m.phone);
  m.address = getVal('address', m.address);
  m.job = getVal('job', m.job);
  m.character = getVal('character', m.character);
  m.hobby = getVal('hobby', m.hobby);
  m.coach = getVal('coach', m.coach);
  m.goal = getVal('goal', m.goal);
  m.stage = getVal('stage', m.stage);
  m.progress = getVal('progress', m.progress);
  m.pain = getVal('pain', m.pain);
  m.restriction = getVal('restriction', m.restriction);
  m.monthlyVisits = parseInt(getVal('monthlyVisits', m.monthlyVisits)) || m.monthlyVisits;
  m.totalBought = parseInt(getVal('totalBought', m.totalBought)) || m.totalBought;
  m.totalConsumed = parseInt(getVal('totalConsumed', m.totalConsumed)) || m.totalConsumed;
  const newRemain = m.totalBought - m.totalConsumed;
  if (newRemain >= 0) m.totalRemain = newRemain;
  m.consumeRate = m.totalBought > 0 ? Math.round(m.totalConsumed/m.totalBought*100) : 0;
  m.totalSpent = parseInt(getVal('totalSpent', m.totalSpent)) || m.totalSpent;
  m.balance = parseInt(getVal('balance', m.balance)) || 0;
  m.satisfaction = parseFloat(getVal('satisfaction', m.satisfaction)) || m.satisfaction;
  m.wakePriority = getVal('wakePriority', m.wakePriority);
  m.tags = getVal('tags', m.tags);
  m.renewWindow = m.totalRemain <= 6;
  m.upsellPotential = getVal('upsellTag', '中') === '高';
  alert('✅ 会员档案已更新，看板数据将实时刷新');
  syncTrialAmountsToPeriods();
  syncCoachStats();
  refreshData();
}

// ==================== MEMBER-COACH SYNC ====================
function syncCoachStats() {
  const d = mockData;
  const coaches = d.coaches || [];
  coaches.forEach(coach => {
    const coachMembers = d.members.filter(m => m.coach === coach.name);
    coach.students = coachMembers.length;
    if (coachMembers.length > 0) {
      coach.consumeRate = Math.round(coachMembers.reduce((s, m) => s + m.consumeRate, 0) / coachMembers.length);
      coach.satisfaction = Math.round((coachMembers.reduce((s, m) => s + (m.satisfaction || 4), 0) / coachMembers.length) * 10) / 10;
    }
    if (d.coachDetail[coach.name]) {
      d.coachDetail[coach.name].members = coachMembers.map(m => ({
        name: m.name,
        attended: m.monthlyVisits,
        total: 12,
        freq: Math.round(m.monthlyVisits / 4 * 10) / 10,
        alert: m.wakePriority === '高'
      }));
    }
  });
}

function getFilteredMembers() {
  const d = mockData;
  let members = d.members || [];
  if (memberDateFilter.from) {
    members = members.filter(m => m.lastVisit && m.lastVisit >= memberDateFilter.from);
  }
  if (memberDateFilter.to) {
    members = members.filter(m => m.lastVisit && m.lastVisit <= memberDateFilter.to);
  }
  return members;
}

function exportMembers() {
  const members = getFilteredMembers();
  const headers = ['会员ID','姓名','性别','年龄','生日','主带教练','总购课(节)','已耗(节)','剩余(节)','耗课率(%)','累计消费(¥)','最后到店','月均到店(次)','续课窗口','升单潜力','唤醒优先级','阶段','会员标签'];
  const rows = members.map(m => [
    m.id, m.name, m.sex, m.age, m.birthday || '--', m.coach,
    m.totalBought, m.totalConsumed, m.totalRemain, m.consumeRate,
    m.totalSpent, m.lastVisit, m.monthlyVisits,
    m.renewWindow ? '是' : '否', m.upsellPotential ? '是' : '否',
    m.wakePriority, m.stage, m.tags
  ]);
  const BOM = '﻿';
  const csv = BOM + headers.join(',') + '\n' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '会员档案_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function handleFile(file) {
  _lastImportFileName = file.name;
  const ext = file.name.split('.').pop().toLowerCase();
  document.getElementById('filePreviewArea').innerHTML = `
    <div class="file-preview">
      <div class="file-info">
        <span class="file-icon">${ext==='xlsx'||ext==='xls'?'📊':ext==='csv'?'📄':'📝'}</span>
        <div><div class="file-name">${file.name}</div><div class="file-size">${(file.size/1024).toFixed(1)} KB</div></div>
      </div>
      <button class="import-btn sm" style="background:var(--danger)" onclick="document.getElementById('filePreviewArea').innerHTML='';parsedFileData=null;">移除</button>
    </div>
    <div class="import-status info">🔄 正在解析文件...</div>
  `;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      if (ext === 'xlsx' || ext === 'xls') {
        parseExcel(e.target.result);
      } else if (ext === 'csv') {
        parseCSV(e.target.result);
      } else if (ext === 'docx') {
        parseWord(e.target.result);
      } else {
        showImportStatus('error', '不支持的文件格式：.' + ext);
      }
    } catch(err) {
      showImportStatus('error', '文件解析失败：' + err.message);
    }
  };
  if (ext === 'docx') {
    reader.readAsArrayBuffer(file);
  } else if (ext === 'csv') {
    reader.readAsText(file, 'UTF-8');
  } else {
    reader.readAsArrayBuffer(file);
  }
}

function parseExcel(data) {
  const wb = XLSX.read(data, { type: 'array' });
  parsedSheets = wb.SheetNames.map(name => ({
    name,
    data: XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' })
  }));
  parsedFileData = parsedSheets[0]?.data || [];
  showSheetSelector();
}

function parseCSV(data) {
  // Handle BOM and line endings
  const text = data.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const rows = lines.map(l => {
    // Handle quoted fields with commas
    const result = []; let curr = ''; let inQuote = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') { inQuote = !inQuote; }
      else if (ch === ',' && !inQuote) { result.push(curr.trim()); curr = ''; }
      else { curr += ch; }
    }
    result.push(curr.trim());
    return result;
  });
  parsedSheets = [{ name: 'CSV数据', data: rows }];
  parsedFileData = rows;
  showPreview(rows);
}

function parseWord(data) {
  mammoth.extractRawText({ arrayBuffer: data }).then(function(result) {
    const text = result.value;
    const lines = text.split('\n').filter(l => l.trim());
    // Try to detect tables in Word text (tab-separated or multiple spaces)
    const rows = lines.map(l => l.split(/\t|\s{2,}/).map(c => c.trim()).filter(c => c));
    const validRows = rows.filter(r => r.length >= 3);
    if (validRows.length > 0) {
      parsedSheets = [{ name: 'Word文档数据', data: validRows }];
      parsedFileData = validRows;
      showPreview(validRows);
    } else {
      showImportStatus('error', 'Word文档中未检测到表格数据。请使用Excel或CSV格式导入。');
    }
  }).catch(function(err) {
    showImportStatus('error', 'Word文档解析失败：' + err.message);
  });
}

function showSheetSelector() {

function autoMapColumns(headers, portal) {
  const map = COLUMN_MAPS[portal] || COLUMN_MAPS['overview'];
  const allFields = getPortalFields(portal);

  return headers.map((h, idx) => {
    const clean = String(h).trim();
    // Try exact match
    let matched = allFields.find(f => f.value === clean || f.label === clean);
    // Try alias match
    if (!matched && map.aliases) {
      const mappedKey = map.aliases[clean];
      if (mappedKey) matched = allFields.find(f => f.value === mappedKey);
    }
    // Try fuzzy match
    if (!matched) {
      matched = allFields.find(f => clean.includes(f.label) || f.label.includes(clean));
    }

    return {
      idx, source: clean || '(空列)',
      matched: !!matched,
      options: [{ value:'', label:'-- 不导入 --', selected:!matched }, ...allFields.map(f => ({ value:f.value, label:f.label, selected:matched?matched.value===f.value:false }))]
    };
  });
}

function executeImport() {
  const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'merge';
  const headers = parsedFileData[0];
  const dataRows = parsedFileData.slice(1).filter(r => r.some(c => c !== ''));

  // Get user mappings
  const mappings = [];
  headers.forEach((h, idx) => {
    const sel = document.getElementById('map_' + idx);
    if (sel && sel.value) mappings.push({ sourceIdx: idx, target: sel.value });
  });

  if (mappings.length === 0) {
    showImportStatus('error', '请至少映射一个字段');
    return;
  }

  // Apply data based on target portal
  applyImportedData(importTarget, mappings, headers, dataRows, mode);

  showImportStatus('success', `✅ 成功导入 ${dataRows.length} 条数据到"${PORTAL_LABELS[importTarget]}"端口`);
  logOperation('import', '数据导入', '导入 ' + dataRows.length + ' 条数据', PORTAL_LABELS[importTarget] + '端口' + (_lastImportFileName ? ' (' + _lastImportFileName + ')' : ''));
  setTimeout(() => { closeImportModal(); refreshData(); }, 1500);
}

function applyImportedData(portal, mappings, headers, dataRows, mode) {
  switch(portal) {
    case 'sales':
      if (mode === 'replace') mockData.channels = [];
      dataRows.forEach(row => {
        const obj = {};
        mappings.forEach(m => { obj[m.target] = row[m.sourceIdx]; });
        const name = obj.channel_name || obj.channel_name_1 || '其他渠道';
        const existing = mockData.channels.find(c => c.name === name);
        const entry = {
          name: name,
          inflow: parseInt(obj.inflow) || 0,
          conversion: parseFloat(obj.conversion) || 0,
          unitPrice: parseInt(obj.unit_price) || parseInt(obj.revenue) || 0,
          inflowLast: parseInt(obj.inflow) ? Math.round(parseInt(obj.inflow)*0.85) : 0,
          convLast: parseFloat(obj.conversion) ? (parseFloat(obj.conversion)-2).toFixed(1) : 0
        };
        if (existing) Object.assign(existing, entry);
        else mockData.channels.push(entry);
      });
      break;
    case 'ops':
      // Update member activity data
      dataRows.forEach(row => {
        const obj = {};
        mappings.forEach(m => { obj[m.target] = row[m.sourceIdx]; });
        if (obj.member_count && obj.activity_level) {
          const level = String(obj.activity_level);
          const count = parseInt(obj.member_count) || 0;
          if (level.includes('高')) mockData.memberActivity.high = count;
          else if (level.includes('中')) mockData.memberActivity.mid = count;
          else if (level.includes('低')) mockData.memberActivity.low = count;
          else if (level.includes('沉睡')) mockData.memberActivity.sleep = count;
        }
        if (obj.actual_value && obj.metric_name) {
          const name = String(obj.metric_name);
          const val = parseFloat(obj.actual_value) || 0;
          if (name.includes('退费')) mockData.risk.refundRate = val;
          if (name.includes('客诉')) mockData.risk.complaintRate = val;
        }
      });
      mockData.memberActivity.total = mockData.memberActivity.high + mockData.memberActivity.mid + mockData.memberActivity.low + mockData.memberActivity.sleep;
      break;
    case 'coach':
      if (mode === 'replace') mockData.coaches = [];
      dataRows.forEach(row => {
        const obj = {};
        mappings.forEach(m => { obj[m.target] = row[m.sourceIdx]; });
        const name = obj.coach_name || '';
        if (!name) return;
        const existing = mockData.coaches.find(c => c.name === name);
        const entry = {
          name: name,
          target: parseInt(obj.target) || 0,
          actual: parseInt(obj.actual) || 0,
          renewRate: parseInt(obj.renew_rate) || 0,
          students: parseInt(obj.student_count) || 0,
          consumeRate: parseInt(obj.consume_rate) || 0,
          satisfaction: parseFloat(obj.satisfaction) || 0
        };
        if (existing) Object.assign(existing, entry);
        else mockData.coaches.push(entry);
      });
      break;
    case 'member':
      if (mode === 'replace') mockData.members = [];
      dataRows.forEach(row => {
        const obj = {};
        mappings.forEach(m => { obj[m.target] = row[m.sourceIdx]; });
        const name = obj.member_name || '';
        if (!name) return;
        const existing = mockData.members.find(m => m.name === name);
        const totalBought = parseInt(obj.total_bought) || 0;
        const totalConsumed = parseInt(obj.total_consumed) || 0;
        const totalRemain = parseInt(obj.total_remain) || (totalBought - totalConsumed);
        const entry = {
          id: obj.member_id || ('M' + String(mockData.members.length+1).padStart(3,'0')),
          name, sex: obj.sex || '女',
          age: parseInt(obj.age) || 30,
          coach: obj.coach || '',
          totalBought, totalConsumed, totalRemain,
          consumeRate: totalBought > 0 ? Math.round(totalConsumed/totalBought*100) : 0,
          totalSpent: parseInt(obj.total_spent) || 0,
          avgPrice: parseInt(obj.total_spent) && totalBought ? Math.round(parseInt(obj.total_spent)/totalBought) : 450,
          lastVisit: obj.last_visit || '',
          monthlyVisits: parseInt(obj.monthly_visits) || 0,
          renewWindow: totalRemain <= 6,
          upsellPotential: (parseInt(obj.total_spent)||0) >= 30000,
          wakePriority: totalRemain >= 40 ? '高' : totalRemain >= 10 ? '中' : '低',
          satisfaction: parseFloat(obj.satisfaction) || 4.0,
          referrals: 0,
          stage: obj.stage || (totalRemain > 40 ? '低活跃' : totalRemain > 10 ? '稳定期' : '续课窗口期'),
          tags: obj.tags || ''
        };
        if (existing) Object.assign(existing, entry);
        else mockData.members.push(entry);
      });
      break;
    case 'overview':
      // Overview imports go to all sub-systems
      if (mode === 'replace') { mockData.channels = []; mockData.coaches = []; mockData.members = []; }
      applyImportedData('sales', mappings, headers, dataRows, 'merge');
      applyImportedData('coach', mappings, headers, dataRows, 'merge');
      applyImportedData('member', mappings, headers, dataRows, 'merge');
      break;
  }
}

function saveCoachDetail(name) {
  const d = mockData;
  const c = d.coaches.find(x => x.name === name);
  const cd = d.coachDetail[name];
  if (!c) return;
  
  // Save basic info
  const getText = (id) => { const el = document.getElementById(id); return el ? el.textContent.trim() : ''; };
  c.birthday = getText('coach_det_birthday');
  c.satisfaction = parseFloat(getText('coach_det_sat')) || c.satisfaction;
  c.students = parseInt(getText('coach_det_stu')) || c.students;
  c.renewRate = parseInt(getText('coach_det_renew')) || c.renewRate;
  c.target = parseInt(getText('coach_det_target')) || c.target;
  c.actual = parseInt(getText('coach_det_actual')) || c.actual;
  c.consumeRate = parseInt(getText('coach_det_consume')) || c.consumeRate;
  
  // Save hexagon dimensions
  const hex = [];
  for (let i = 0; i < 6; i++) {
    const el = document.getElementById('hex_c_' + i);
    hex.push(el ? parseInt(el.value) : 0);
  }
  if (cd) cd.hexagon = hex;
  
  // Save weaknesses & trainings
  const wEl = document.getElementById('coach_weaknesses');
  const tEl = document.getElementById('coach_trainings');
  if (cd) {
    cd.weaknesses = wEl ? wEl.value.split(/[；;]/).filter(Boolean) : cd.weaknesses;
    cd.trainings = tEl ? tEl.value.split(/[；;]/).filter(Boolean) : cd.trainings;
  }
  
  alert('✅ ' + name + ' 信息已更新');
  backToHexOverview();
}

// ======== CHART INIT ========
function initHexagonCharts() {
  const d = mockData;
  
  if (selectedHexPerson) return; // Detail charts handled separately
  
  if (coachInfoTab === 'coach') {
    // Individual coach radar charts
    d.coaches.forEach((c, i) => {
      const cd = d.coachDetail[c.name] || {};
      const hex = cd.hexagon || [0,0,0,0,0,0];
      const chart = getChart('hex_coach_' + i);
      if (!chart) return;
      chart.setOption({
        radar: {
          center: ['50%', '55%'],
          radius: '65%',
          indicator: HEX_DIMS.map(dim => ({ name: dim, max: 100 })),
          axisName: { fontSize: 10, color: '#64748b' }
        },
        series: [{
          type: 'radar',
          data: [{ value: hex, name: c.name, areaStyle: { color: 'rgba(79,70,229,.15)' }, lineStyle: { color: '#4f46e5', width: 2 }, itemStyle: { color: '#4f46e5' } }]
        }]
      });
    });
    
    // All coaches comparison radar
    const allChart = getChart('hexAllCoaches');
    if (allChart) {
      const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ef4444'];
      allChart.setOption({
        legend: { data: d.coaches.map(c => c.name), bottom: 0, textStyle: { fontSize: 10 } },
        radar: {
          center: ['50%', '50%'],
          radius: '60%',
          indicator: HEX_DIMS.map(dim => ({ name: dim, max: 100 })),
          axisName: { fontSize: 11 }
        },
        series: d.coaches.map((c, i) => ({
          type: 'radar',
          data: [{ value: (d.coachDetail[c.name] || {}).hexagon || [0,0,0,0,0,0], name: c.name }],
          lineStyle: { color: colors[i], width: 2 },
          itemStyle: { color: colors[i] },
          areaStyle: { color: colors[i].replace(')', ',.05)').replace('rgb', 'rgba') }
        }))
      });
    }
  } else {
    // Consultant radar charts
    (d.salesConsultants || []).forEach((s, i) => {
      const hex = s.hexagon || [0,0,0,0,0,0];
      const chart = getChart('hex_consult_' + i);
      if (!chart) return;
      chart.setOption({
        radar: {
          center: ['50%', '55%'],
          radius: '65%',
          indicator: HEX_DIMS.map(dim => ({ name: dim, max: 100 })),
          axisName: { fontSize: 10, color: '#64748b' }
        },
        series: [{
          type: 'radar',
          data: [{ value: hex, name: s.name, areaStyle: { color: 'rgba(245,158,11,.15)' }, lineStyle: { color: '#f59e0b', width: 2 }, itemStyle: { color: '#f59e0b' } }]
        }]
      });
    });
    
    // All consultants comparison
    const allChart = getChart('hexAllConsultants');
    if (allChart) {
      const colors = ['#f59e0b', '#3b82f6', '#10b981', '#ef4444'];
      allChart.setOption({
        legend: { data: (d.salesConsultants || []).map(s => s.name), bottom: 0, textStyle: { fontSize: 10 } },
        radar: {
          center: ['50%', '50%'],
          radius: '60%',
          indicator: HEX_DIMS.map(dim => ({ name: dim, max: 100 })),
          axisName: { fontSize: 11 }
        },
        series: (d.salesConsultants || []).map((s, i) => ({
          type: 'radar',
          data: [{ value: s.hexagon, name: s.name }],
          lineStyle: { color: colors[i], width: 2 },
          itemStyle: { color: colors[i] }
        }))
      });
    }
  }

let trialModalState = null; // { coachName, trialIdx }
let trialModalActiveTab = 'basic';

function showTrialDetailModal(coachName, trialIdx) {
  const cd = mockData.coachDetail[coachName];
  if (!cd || !cd.trials || !cd.trials[trialIdx]) return;
  const t = cd.trials[trialIdx];
  trialModalState = { coachName: coachName, trialIdx: trialIdx };
  trialModalActiveTab = 'basic';
  renderTrialModal(t);
}

function renderTrialModal(t) {
  const existing = document.getElementById('trialDetailModal');
  if (existing) existing.remove();
  const isNew = !t.preClass;
  const pi = t.prospectInfo || {};
  const pc = t.preClass || {};
  const dc = t.duringClass || {};
  const cl = t.closing || {};
  const fu = t.followUps || {};
  const imgs = t.images || [];
  const cn = trialModalState.coachName;
  const ti = trialModalState.trialIdx;
  
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  
  const tabContent = trialModalActiveTab === 'basic' ? renderTrialTabBasic(t, pi) :
    trialModalActiveTab === 'preclass' ? renderTrialTabPreClass(t, pc) :
    trialModalActiveTab === 'during' ? renderTrialTabDuring(t, dc) :
    trialModalActiveTab === 'closing' ? renderTrialTabClosing(t, cl) :
    trialModalActiveTab === 'images' ? renderTrialTabImages(t, imgs, cn, ti) :

  overlay.id = 'trialDetailModal';

      <div class="trial-modal-header">
        <div>
          <h2>📝 体验课详情 - ${esc(t.name)}</h2>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">
