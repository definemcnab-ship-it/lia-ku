<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1360" width="1080" height="1360" font-family="-apple-system,'PingFang SC',sans-serif">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3C6A6"/><stop offset="100%" stop-color="#E6A87E"/>
    </linearGradient>
    <linearGradient id="wear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8CCD2"/><stop offset="100%" stop-color="#A8AEB6"/>
    </linearGradient>
    <linearGradient id="wear2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFC4CB"/><stop offset="100%" stop-color="#9AA0A8"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1080" height="1360" fill="#F4F8FD"/>

  <!-- ===== Title ===== -->
  <text x="48" y="110" font-size="78" font-weight="800" fill="#1A1A1A">正面<tspan fill="#2F6BE0">体态</tspan>评估</text>
  <rect x="48" y="138" width="430" height="52" rx="10" fill="#2F6BE0"/>
  <text x="263" y="174" font-size="28" font-weight="600" fill="#fff" text-anchor="middle">科学评估体态 · 精准改善问题</text>

  <!-- 评估要点 box -->
  <rect x="700" y="48" width="340" height="150" rx="20" fill="#EAF1FB"/>
  <text x="742" y="96" font-size="30" font-weight="700" fill="#2F6BE0">☆ 评估要点</text>
  <circle cx="752" cy="132" r="9" fill="#2F6BE0"/><text x="772" y="141" font-size="24" fill="#3A4250">自然站立，放松身体</text>
  <circle cx="752" cy="170" r="9" fill="#2F6BE0"/><text x="772" y="179" font-size="24" fill="#3A4250">观察各标志点位置</text>

  <!-- page indicator -->
  <circle cx="1010" cy="80" r="34" fill="#B8BEC8"/><text x="1010" y="92" font-size="30" fill="#fff" text-anchor="middle">1/3</text>

  <!-- ===== center plumb line ===== -->
  <line x1="540" y1="230" x2="540" y2="1210" stroke="#E2453A" stroke-width="2.5" stroke-dasharray="9,8" opacity="0.8"/>

  <!-- ===== FIGURE (front, gray sportswear) ===== -->
  <!-- hair back -->
  <ellipse cx="540" cy="288" rx="70" ry="74" fill="#3A2A20"/>
  <path d="M566 300 Q598 286 590 336 Q582 372 566 356 Z" fill="#3A2A20"/>
  <!-- head -->
  <ellipse cx="540" cy="300" rx="58" ry="66" fill="url(#skin)"/>
  <!-- hair top -->
  <path d="M483 282 Q500 224 540 224 Q580 224 597 282 Q570 256 540 256 Q510 256 483 282 Z" fill="#3A2A20"/>
  <!-- face -->
  <ellipse cx="520" cy="298" rx="6" ry="7.5" fill="#4A2C1A"/>
  <ellipse cx="560" cy="298" rx="6" ry="7.5" fill="#4A2C1A"/>
  <path d="M505 286 Q513 281 522 285" stroke="#4A2C1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M558 285 Q567 281 575 286" stroke="#4A2C1A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M524 332 Q540 342 556 332" stroke="#C9806A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="518" y="352" width="44" height="40" rx="14" fill="url(#skin)"/>
  <!-- shoulders skin -->
  <ellipse cx="452" cy="408" rx="26" ry="18" fill="url(#skin)"/>
  <ellipse cx="628" cy="408" rx="26" ry="18" fill="url(#skin)"/>
  <!-- sports bra -->
  <path d="M462 392 Q462 384 472 382 L608 382 Q618 384 618 392 L632 560 Q632 568 622 568 L458 568 Q448 568 448 560 Z" fill="url(#wear)"/>
  <!-- bra straps -->
  <path d="M495 384 L487 360 Q484 350 496 348 L508 348 Q518 350 514 360 L508 384 Z" fill="url(#wear)"/>
  <path d="M585 384 L573 360 Q566 350 576 348 L588 348 Q600 350 593 360 L585 384 Z" fill="url(#wear)"/>
  <!-- bra band -->
  <rect x="452" y="548" width="176" height="20" rx="6" fill="#9AA0A8"/>
  <!-- midriff -->
  <path d="M470 568 Q470 620 480 648 L600 648 Q610 620 610 568 Z" fill="url(#skin)"/>
  <ellipse cx="540" cy="608" rx="4" ry="7" fill="#D49A78"/>
  <!-- arms -->
  <path d="M440 404 Q414 470 408 560 Q406 590 416 596 Q428 600 432 572 L448 472 Q452 424 446 404 Z" fill="url(#skin)"/>
  <path d="M412 588 Q406 640 410 690 Q412 712 424 714 Q436 714 437 692 L436 612 Q432 596 424 590 Z" fill="url(#skin)"/>
  <ellipse cx="424" cy="726" rx="20" ry="28" fill="url(#skin)"/>
  <path d="M640 404 Q666 470 672 560 Q674 590 664 596 Q652 600 648 572 L632 472 Q628 424 634 404 Z" fill="url(#skin)"/>
  <path d="M668 588 Q674 640 670 690 Q668 712 656 714 Q644 714 643 692 L644 612 Q648 596 656 590 Z" fill="url(#skin)"/>
  <ellipse cx="656" cy="726" rx="20" ry="28" fill="url(#skin)"/>
  <!-- leggings waistband -->
  <path d="M478 644 L602 644 Q612 646 612 658 L610 690 L470 690 L468 658 Q468 646 478 644 Z" fill="url(#wear2)"/>
  <!-- leggings -->
  <path d="M470 684 Q464 800 458 920 Q452 1020 450 1110 Q449 1140 460 1150 L498 1150 Q506 1118 508 1080 Q512 940 520 820 Q526 728 534 686 Z" fill="url(#wear2)"/>
  <path d="M610 684 Q616 800 622 920 Q628 1020 630 1110 Q631 1140 620 1150 L582 1150 Q574 1118 572 1080 Q568 940 560 820 Q554 728 546 686 Z" fill="url(#wear2)"/>
  <path d="M534 686 Q540 716 546 686" stroke="#9AA0A8" stroke-width="2" fill="none"/>
  <!-- calves -->
  <path d="M460 1148 Q458 1190 462 1224 Q464 1244 478 1248 L494 1248 Q502 1244 500 1224 L498 1148 Z" fill="url(#skin)"/>
  <path d="M620 1148 Q622 1190 618 1224 Q616 1244 602 1248 L586 1248 Q578 1244 580 1224 L582 1148 Z" fill="url(#skin)"/>
  <!-- feet bare -->
  <ellipse cx="476" cy="1262" rx="34" ry="16" fill="url(#skin)"/>
  <ellipse cx="604" cy="1262" rx="34" ry="16" fill="url(#skin)"/>
  <ellipse cx="448" cy="1264" rx="9" ry="6" fill="url(#skin)"/>
  <ellipse cx="500" cy="1265" rx="9" ry="6" fill="url(#skin)"/>
  <ellipse cx="580" cy="1265" rx="9" ry="6" fill="url(#skin)"/>
  <ellipse cx="632" cy="1264" rx="9" ry="6" fill="url(#skin)"/>

  <!-- ===== connector dashes + dots ===== -->
  <g stroke="#2F6BE0" stroke-width="2" stroke-dasharray="7,7" opacity="0.55">
    <line x1="565" y1="306" x2="700" y2="306"/>   <!-- 头 -->
    <line x1="470" y1="430" x2="378" y2="430"/>   <!-- 肩 -->
    <line x1="500" y1="600" x2="378" y2="600"/>   <!-- 肋骨架 -->
    <line x1="560" y1="730" x2="700" y2="730"/>   <!-- 骨盆 -->
    <line x1="500" y1="930" x2="378" y2="930"/>   <!-- 膝 -->
    <line x1="586" y1="1010" x2="700" y2="1010"/> <!-- 腿 -->
    <line x1="540" y1="1186" x2="378" y2="1186"/> <!-- 足 -->
  </g>
  <g fill="#E2453A" stroke="#fff" stroke-width="3">
    <circle cx="565" cy="306" r="11"/>
    <circle cx="470" cy="430" r="11"/>
    <circle cx="500" cy="600" r="11"/>
    <circle cx="560" cy="730" r="11"/>
    <circle cx="500" cy="930" r="11"/>
    <circle cx="586" cy="1010" r="11"/>
    <circle cx="540" cy="1186" r="11"/>
  </g>

  <!-- ===== LEFT callouts ===== -->
  <!-- 肩 -->
  <g>
    <circle cx="70" cy="318" r="20" fill="#2F6BE0"/><text x="70" y="327" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">1</text>
    <text x="112" y="328" font-size="38" font-weight="700" fill="#222">肩</text>
    <text x="48" y="380" font-size="24" fill="#3A4250"><tspan x="48" dy="0">锁骨呈柔和的小倒"八"字，两侧肩峰</tspan><tspan x="48" dy="34">等高；据此观察有无高低肩或圆肩。</tspan></text>
  </g>
  <!-- 肋骨架 -->
  <g>
    <circle cx="70" cy="500" r="20" fill="#2F6BE0"/><text x="70" y="509" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">2</text>
    <text x="112" y="510" font-size="38" font-weight="700" fill="#222">肋骨架</text>
    <text x="48" y="562" font-size="24" fill="#3A4250"><tspan x="48" dy="0">两侧肋骨下角在同一水平线，肋廓与骨</tspan><tspan x="48" dy="34">盆处于同一冠状面、上下对齐。高低不</tspan><tspan x="48" dy="34">平多与脊柱侧弯有关，前后偏移则是胸</tspan><tspan x="48" dy="34">廓旋转或平移。</tspan></text>
  </g>
  <!-- 膝 -->
  <g>
    <circle cx="70" cy="858" r="20" fill="#2F6BE0"/><text x="70" y="867" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">3</text>
    <text x="112" y="868" font-size="38" font-weight="700" fill="#222">膝</text>
    <text x="48" y="920" font-size="24" fill="#3A4250"><tspan x="48" dy="0">大腿中点、髌骨中点、踝中点三点应在</tspan><tspan x="48" dy="34">同一直线上。髌骨偏内为膝内扣，偏外</tspan><tspan x="48" dy="34">为膝外翻。</tspan></text>
  </g>
  <!-- 足 -->
  <g>
    <circle cx="70" cy="1080" r="20" fill="#2F6BE0"/><text x="70" y="1089" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">4</text>
    <text x="112" y="1090" font-size="38" font-weight="700" fill="#222">足</text>
    <text x="48" y="1142" font-size="24" fill="#3A4250"><tspan x="48" dy="0">双脚并拢、脚尖朝前，大脚趾向外偏移</tspan><tspan x="48" dy="34">即为拇外翻。</tspan></text>
  </g>

  <!-- ===== RIGHT callouts ===== -->
  <!-- 头 -->
  <g>
    <text x="742" y="328" font-size="38" font-weight="700" fill="#222">头</text>
    <text x="700" y="380" font-size="24" fill="#3A4250"><tspan x="700" dy="0">眉心、下巴尖、胸骨柄在一条直线上，</tspan><tspan x="700" dy="34">双眼连线与地面平行，两侧脸颊在同一</tspan><tspan x="700" dy="34">平面，无歪头或颞下颌关节紊乱。</tspan></text>
  </g>
  <!-- 骨盆 -->
  <g>
    <text x="742" y="700" font-size="38" font-weight="700" fill="#222">骨盆</text>
    <text x="700" y="752" font-size="24" fill="#3A4250"><tspan x="700" dy="0">两侧髂前上棘在同一平面，连线与地面</tspan><tspan x="700" dy="34">平行。一前一后是骨盆旋转，一高一低</tspan><tspan x="700" dy="34">则是高低骨盆。</tspan></text>
  </g>
  <!-- 腿 -->
  <g>
    <text x="742" y="982" font-size="38" font-weight="700" fill="#222">腿</text>
    <text x="700" y="1034" font-size="24" fill="#3A4250"><tspan x="700" dy="0">双腿并拢，膝盖先碰到但踝间留缝为X</tspan><tspan x="700" dy="34">型腿；踝先碰到但膝间留缝为O型腿。</tspan></text>
  </g>

  <!-- ===== footer 小贴士 ===== -->
  <rect x="40" y="1228" width="1000" height="112" rx="20" fill="#EAF1FB"/>
  <text x="78" y="1278" font-size="28" font-weight="700" fill="#2F6BE0">💡 小贴士</text>
  <g font-size="22" fill="#3A4250">
    <text x="200" y="1268" font-weight="700" fill="#222">自然站立</text><text x="200" y="1300">双脚与髋同宽</text><text x="200" y="1328">放松身体肌肉</text>
    <text x="470" y="1268" font-weight="700" fill="#222">多角度观察</text><text x="470" y="1300">侧面、正面、背面</text><text x="470" y="1328">综合评估</text>
    <text x="720" y="1268" font-weight="700" fill="#222">拍照记录</text><text x="720" y="1300">定期拍照对比</text><text x="720" y="1328">观察改善效果</text>
    <text x="900" y="1268" font-weight="700" fill="#222">专业评估</text><text x="900" y="1300">如有疼痛不适</text><text x="900" y="1328">建议寻求专业评估</text>
  </g>
</svg>
